<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#1c1c1a;--muted:#77776f;--key:#ecece7;--op:#dfe7ff;--opt:#2b4acb;--eq:#2b4acb;--eqt:#fff;--bd:#d9d9d2;--warn:#b4531a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1f1d;--text:#f0f0ea;--muted:#9a9a90;--key:#2c2c29;--op:#25305c;--opt:#aebdff;--eq:#5b78ff;--eqt:#fff;--bd:#3a3a36;--warn:#e8925a}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1f1d;--text:#f0f0ea;--muted:#9a9a90;--key:#2c2c29;--op:#25305c;--opt:#aebdff;--eq:#5b78ff;--eqt:#fff;--bd:#3a3a36;--warn:#e8925a}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.calc{width:100%;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.badge{padding:3px 9px;border-radius:99px;background:var(--key)}
.badge.low{color:var(--warn)}
.screen{text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:4px 6px 12px;overflow:hidden}
.expr{font-size:15px;color:var(--muted);min-height:20px;word-break:break-all}
.out{font-size:40px;font-weight:600;word-break:break-all;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font:inherit;font-size:20px;border:0;border-radius:14px;padding:16px 0;background:var(--key);color:var(--text);cursor:pointer}
button:active{transform:scale(.96)}
button.op{background:var(--op);color:var(--opt)}
button.eq{background:var(--eq);color:var(--eqt)}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:20px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:20px}
.overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.price{font-size:28px;font-weight:700}
.price small{font-size:14px;font-weight:400;color:var(--muted)}
.overlay button{width:100%;font-size:16px;padding:13px}
.overlay{overflow:auto;gap:8px}
.qrs{display:flex;gap:10px;width:100%}
.qr{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.qr img,.qr .ph{width:100%;aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--bd);object-fit:contain}
.qr .ph{display:none;align-items:center;justify-content:center;color:var(--muted);font-size:11px;padding:6px}
#code{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--key);color:var(--text);text-align:center}
.err{color:var(--warn);font-size:12px;min-height:14px}
.overlay{overflow:auto;gap:8px;justify-content:safe center}
.up{width:100%;display:block;border:2px dashed var(--bd);border-radius:12px;padding:12px;font-size:14px;color:var(--muted);cursor:pointer;word-break:break-all}
#prev{max-height:56px;max-width:100%;border-radius:8px;border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;color:var(--muted);font-size:12px;padding:4px;width:auto!important;text-decoration:underline}
</style>
</head>

    <label class="up"><input type="file" id="rcpt" accept="image/*" hidden><span id="upt">Upload your receipt</span></label>
    <img id="prev" alt="Receipt preview" style="display:none">
    <div class="err" id="err"></div>
    <button class="eq" id="sub" disabled>Submit receipt</button>
  </div>
</div>
<script>
(function(){
  var LIMIT=5, K_USED="calc_used_v2", K_SUB="calc_sub_v2";
  var used=0, subscribed=false, expr="", justEq=false;
  function load(){try{used=parseInt(localStorage.getItem(K_USED)||"0",10)||0;subscribed=localStorage.getItem(K_SUB)==="1";}catch(e){}}
  function save(){try{localStorage.setItem(K_USED,String(used));localStorage.setItem(K_SUB,subscribed?"1":"0");}catch(e){}}
  load();
  var $=function(id){return document.getElementById(id)};
  var layout=["C","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","(",")","="];
  var keys=$("keys");
  layout.forEach(function(k){
    var b=document.createElement("button");b.textContent=k;
    if("÷×−+".indexOf(k)>-1)b.className="op";
    if(k==="="){b.className="eq";b.style.gridColumn="span 4"}
    b.onclick=function(){press(k)};keys.appendChild(b);
  });
  function show(){$("expr").textContent=expr}
  function paywall(){$("paywall").classList.add("show")}
  function press(k){
    if(!subscribed&&used>=LIMIT){paywall();return}
    if(k==="C"){expr="";$("out").textContent="0";justEq=false;show();return}
    if(k==="⌫"){expr=expr.slice(0,-1);justEq=false;show();return}
    if(k==="="){return calc()}
    if(justEq&&/[0-9.(]/.test(k)){expr="";}
    justEq=false;
    var last=expr.slice(-1);
    if("÷×−+".indexOf(k)>-1&&"÷×−+".indexOf(last)>-1)expr=expr.slice(0,-1);
    expr+=k;show();
  }
  function calc(){
    if(!expr)return;
    var s=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");
    if(!/^[0-9+\-*\/.()\s]+$/.test(s)){$("out").textContent="Error";return}
    var r;
    try{r=Function('"use strict";return ('+s+')')()}catch(e){r=NaN}
    if(typeof r!=="number"||!isFinite(r)){$("out").textContent="Error";return}
    r=Math.round(r*1e10)/1e10;
    $("out").textContent=String(r);
    expr=String(r);justEq=true;
    if(!subscribed){used++;save()}
    show();
  }
  document.addEventListener("keydown",function(e){
    var m={"*":"×","/":"÷","-":"−"};var k=m[e.key]||e.key;
    if(/^[0-9.+()%]$/.test(k)||"×÷−".indexOf(k)>-1)press(k);
    else if(e.key==="Enter"||e.key==="="){e.preventDefault();press("=")}
    else if(e.key==="Backspace")press("⌫");
    else if(e.key==="Escape")press("C");
  });
  var fileOk=false;
  $("rcpt").onchange=function(){
    var f=this.files&&this.files[0];fileOk=false;$("sub").disabled=true;$("err").textContent="";$("prev").style.display="none";
    if(!f)return;
    if(!/^image\//.test(f.type)){$("err").textContent="Please upload an image of your receipt.";return}
    if(f.size>10*1024*1024){$("err").textContent="Image is too large (max 10 MB).";return}
    var r=new FileReader();
    r.onload=function(){$("prev").src=r.result;$("prev").style.display="block"};
    r.readAsDataURL(f);
    $("upt").textContent=f.name;fileOk=true;$("sub").disabled=false;
  };
  $("sub").onclick=function(){if(!fileOk)return;subscribed=true;save();$("paywall").classList.remove("show");show()};
  show();
  if(!subscribed&&used>=LIMIT)paywall();
})();
</script>
